services:
  app:
    build:
      context: ../docker/php
      dockerfile: ./Dockerfile
    image: papermill-backend-app
    container_name: papermill-backend-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ../docker/php/php.ini:/usr/local/etc/php/php.ini
    environment:
      - APP_ENV=local
      - APP_KEY=base64:Be5c4sv300DJjtVftP7vggkfNucMDddHezZCDvCKxr8=
      - DB_HOST=mysql
      - DB_DATABASE=papermill
      - DB_USERNAME=papermill
      - DB_PASSWORD=papermill
      - JWT_SECRET=W586o9EAXzoyMNdlbcnfe4qd2a0ZQqehWc1EXCsxduaKqHWY1ocw7p6LsBFe4ESV
    depends_on:
      - mysql
    command: php artisan octane:start --server=swoole --host=0.0.0.0 --port=8000 --watch
    ports:
      - "8000:8000"

  nginx:
    image: nginx:1.25
    container_name: papermill-backend-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: papermill-backend-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: papermill
      MYSQL_USER: papermill
      MYSQL_PASSWORD: papermill
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../docker/mysql/my.cnf:/etc/mysql/my.cnf

volumes:
  mysql_data:
