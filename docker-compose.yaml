
services:
  nginx:
    image: nginx:alpine
    container_name: papermill-nginx
    ports:
      - "8088:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - papermill-network

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: papermill-php
    volumes:
      - ./backend:/var/www/html
    networks:
      - papermill-network
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: papermill-mysql
    ports:
      - "3307:3306"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=papermill_db
      - MYSQL_USER=papermill_user
      - MYSQL_PASSWORD=papermill_pass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - papermill-network

  redis:
    image: redis:7-alpine
    container_name: papermill-redis
    ports:
      - "6381:6379"
    networks:
      - papermill-network

  node:
    image: node:22-alpine
    container_name: papermill-node
    working_dir: /app
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --force"
    networks:
      - papermill-network

networks:
  papermill-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local

