services:
  nginx:
    image: nginx:1.27-alpine
    container_name: papermill-nginx
    ports:
      - "8088:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - papermill-network
    restart: unless-stopped
    environment:
      - TZ=America/Mexico_City  
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: papermill-php
    volumes:
      - ./backend:/var/www/html
    networks:
      - papermill-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    environment:
      - TZ=America/Mexico_City 
      - APP_DEBUG=true
      - APP_TIMEZONE=America/Mexico_City  
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=papermill_db
      - DB_USERNAME=papermill_user
      - DB_PASSWORD=papermill_pass
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  mysql:
    image: mysql:8.4
    container_name: papermill-mysql
    ports:
      - "3307:3306"
    environment:
      - TZ=America/Mexico_City  
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=papermill_db
      - MYSQL_USER=papermill_user
      - MYSQL_PASSWORD=papermill_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - papermill-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7.4-alpine
    container_name: papermill-redis
    ports:
      - "6381:6379"
    networks:
      - papermill-network
    restart: unless-stopped
    environment:
      - TZ=America/Mexico_City  
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: redis-server --appendonly yes

  mailhog:
    image: mailhog/mailhog:latest
    container_name: papermill-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - papermill-network
    restart: unless-stopped
    environment:
      - TZ=America/Mexico_City  

networks:
  papermill-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local